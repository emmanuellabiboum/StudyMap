name: Mise à jour des données (scraper)

on:
  schedule:
    - cron: "0 6 * * 1" # tous les lundis à 06:00 UTC
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write # pour committer data/scholarships.json
  actions: write # pour relancer le déploiement

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt
      - run: python -m unittest discover scraper
      - run: python scraper/scrape.py
      - run: python scraper/validate.py

      - name: Commit + redéployer si les données ont changé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain data scraper/last_report.md)" ]; then
            git config user.name "studymap-bot"
            git config user.email "studymap-bot@users.noreply.github.com"
            git add data scraper/last_report.md
            git commit -m "data: mise à jour automatique ($(date -u +%F))"
            git push
            # Un push fait avec GITHUB_TOKEN ne déclenche pas deploy.yml : on le lance explicitement.
            gh workflow run deploy.yml
          else
            echo "Aucun changement."
          fi
